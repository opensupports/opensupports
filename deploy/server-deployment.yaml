apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensupports-server
  namespace: supports
  labels:
    app: opensupports-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensupports-server
  template:
    metadata:
      labels:
        app: opensupports-server
    spec:
      imagePullSecrets:
      - name: harbor-secret
      containers:
      - name: server
        image: harbor.pai-world.com/opensupports/opensupports-srv:v1.3
        imagePullPolicy: Always
        command: ["/bin/sh"]
        args: ["-c", "a2enmod headers && apache2-foreground"]
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: opensupports-secret
        - configMapRef:
            name: opensupports-server-config
        volumeMounts:
        - name: files-storage
          mountPath: /var/www/html/files
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: files-storage
        persistentVolumeClaim:
          claimName: opensupports-files-pvc
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z mysql-service 3306; do echo waiting for mysql; sleep 2; done;']
---
apiVersion: v1
kind: Service
metadata:
  name: opensupports-server
  namespace: supports
  labels:
    app: opensupports-server
spec:
  selector:
    app: opensupports-server
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensupports-files-pvc
  namespace: supports
  labels:
    app: opensupports-server
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: "longhorn"
