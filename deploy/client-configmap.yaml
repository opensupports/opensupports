apiVersion: v1
kind: ConfigMap
metadata:
  name: opensupports-client-config
  namespace: supports
  labels:
    app: opensupports-client
data:
  # 클라이언트 환경 설정
  REACT_APP_API_URL: "https://nts-supports.pai-world.com/api"
  REACT_APP_CLIENT_URL: ""
  NODE_ENV: "production"
  
  # nginx 환경변수 (필요시 사용)
  NGINX_HOST: "opensupports-client"
  NGINX_PORT: "80"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensupports-server-config
  namespace: supports
  labels:
    app: opensupports-server
data:
  # 서버 환경 설정
  APACHE_DOCUMENT_ROOT: "/var/www/html"
  APACHE_SERVER_NAME: "opensupports-server"
  
  # PHP 설정
  PHP_MEMORY_LIMIT: "256M"
  PHP_MAX_EXECUTION_TIME: "300"
  PHP_POST_MAX_SIZE: "50M"
  PHP_UPLOAD_MAX_FILESIZE: "50M"
